{% extends "base.html" %}
{% block title %}Registro de Usuario{% endblock %}
{% block content %}

<!-- component -->
<div class="bg-gray-100 flex justify-center items-center h-screen">
    <!-- Left: Image -->
    <div class="w-1/2 h-screen hidden lg:block">
        <img src="https://img.freepik.com/vector-gratis/ilustracion-deliciosa-cafetera-plastico-donut_24877-58122.jpg" alt="Placeholder Image" class="object-cover w-full h-full">
    </div>
    <!-- Right: Registration Form -->
    <div class="lg:p-36 md:p-52 sm:20 p-8 w-full lg:w-1/2">
        <h1 class="text-2xl font-semibold mb-4">Registro</h1>
        <form action="" method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label for="username" class="block text-gray-600">Nombre de usuario</label>
                <input type="text" name="{{ form.username.name }}" class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500">
            </div>
            <div class="mb-4">
                <label for="password1" class="block text-gray-600">Contraseña</label>
                <input type="password" name="{{ form.password1.name }}" class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500">
            </div>
            <div class="mb-4">
                <label for="password2" class="block text-gray-600">Confirmar Contraseña</label>
                <input type="password" name="{{ form.password2.name }}" class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-md py-2 px-4 w-full">Registrarse</button>
        </form>
        

        <!-- Login Link -->
        <div class="mt-6 text-blue-500 text-center">
            <a href="{% url 'login' %}" class="hover:underline">¿Ya tienes una cuenta? Inicia sesión aquí</a>
        </div>
    </div>
</div>

{% endblock %}
