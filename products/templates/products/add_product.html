{% extends "base.html" %}
{% block content %}

<form action="{% url "add_product" %}" method="post" enctype="multipart/form-data" class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-3xl font-bold underline y-20"> Agregar Producto  </h1>
    {% csrf_token %}
    
    {% for field in form %}
        <div class="mb-4">
            <label for="{{ field.id_for_label }}" class="block text-gray-700 font-semibold mb-2">
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
                <p class="text-red-500 text-sm mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
    {% endfor %}

    <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
        Agregar
    </button>
</form>


{% endblock content %}
