{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Tienda{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
</head>
<body class="bg-gray-100 text-gray-900">

    <!-- Navbar -->
    <nav class="bg-blue-500 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between">
            <a href="{% url 'list_product' %}" class="text-lg font-bold">Mi Tienda</a>
            <a href="{% url 'add_product' %}" class="bg-white text-blue-500 px-4 py-2 rounded hover:bg-gray-200">
                Agregar Producto
            </a>
        </div>
    </nav>

    <!-- Contenido dinámico -->
    <div class="container mx-auto mt-10 px-4">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
